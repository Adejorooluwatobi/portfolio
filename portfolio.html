<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Featured Works & Projects — Oluwatobi Adejoro</title>
    <meta name="description" content="Production applications, client ecosystems, and web systems engineered by Oluwatobi Adejoro, Senior Fullstack Software Engineer."/>
    <link rel="shortcut icon" type="image/x-icon" href="assets/img/favicon2.jpg"/>
    
    <!-- Google Fonts & Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=JetBrains+Mono:wght@100..900&family=Plus+Jakarta+Sans:wght@100..900&display=swap" rel="stylesheet"/>
    
    <!-- Theme Stylesheet & Anti-flicker Init -->
    <link rel="stylesheet" href="assets/css/theme.css"/>
    <script>
        if (localStorage.theme === 'light' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: light)').matches)) {
            document.documentElement.classList.remove('dark');
        } else {
            document.documentElement.classList.add('dark');
        }
    </script>

    <!-- Tailwind CSS with custom theme config matching design reference -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: {
                    "surface": "var(--color-surface)",
                    "surface-card": "var(--color-surface-card)",
                    "surface-container": "var(--color-surface-container)",
                    "surface-container-low": "var(--color-surface-container-low)",
                    "surface-container-lowest": "var(--color-surface-container-lowest)",
                    "surface-container-high": "var(--color-surface-container-high)",
                    "surface-container-highest": "var(--color-surface-container-highest)",
                    "on-surface": "var(--color-on-surface)",
                    "on-surface-variant": "var(--color-on-surface-variant)",
                    "text-primary": "var(--color-text-primary)",
                    "text-secondary": "var(--color-text-secondary)",
                    "text-muted": "var(--color-text-muted)",
                    "primary": "var(--color-primary)",
                    "primary-container": "var(--color-primary-container)",
                    "on-primary-container": "var(--color-on-primary-container)",
                    "secondary": "var(--color-secondary)",
                    "tertiary": "var(--color-tertiary)",
                    "tertiary-container": "var(--color-tertiary-container)",
                    "border-subtle": "var(--color-border-subtle)",
                    "border-accent": "var(--color-border-accent)",
                    "error": "var(--color-error)"
                },
                fontFamily: {
                    "headline-lg": ["Plus Jakarta Sans", "sans-serif"],
                    "headline-md": ["Plus Jakarta Sans", "sans-serif"],
                    "headline-sm": ["Plus Jakarta Sans", "sans-serif"],
                    "display-hero": ["Plus Jakarta Sans", "sans-serif"],
                    "body-lg": ["Inter", "sans-serif"],
                    "body-md": ["Inter", "sans-serif"],
                    "body-sm": ["Inter", "sans-serif"],
                    "code-md": ["JetBrains Mono", "monospace"],
                    "code-sm": ["JetBrains Mono", "monospace"],
                    "label-badge": ["JetBrains Mono", "monospace"]
                }
            }
        }
    };
    </script>
    <style>
        @layer base {
            html, body { margin: 0; padding: 0; scroll-behavior: smooth; }
            ::-webkit-scrollbar { width: 8px; }
            ::-webkit-scrollbar-track { background: var(--color-surface-container-lowest); }
            ::-webkit-scrollbar-thumb { background: var(--color-surface-container-high); border-radius: 4px; }
            ::-webkit-scrollbar-thumb:hover { background: var(--color-primary); }
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body-md min-h-screen flex flex-col selection:bg-primary-container selection:text-on-primary-container">

    <!-- Centralized Persistent Header & Mobile Drawer -->
    <div id="site-header"></div>

    <!-- Main Portfolio Page Content -->
    <main class="w-full pt-28 pb-20 flex-grow">
        <div class="relative w-full overflow-hidden">
            
            <!-- Ambient Violet & Emerald Glow -->
            <div class="absolute top-10 left-1/2 -translate-x-1/2 w-[700px] h-[350px] bg-primary-container/15 rounded-full blur-[140px] pointer-events-none"></div>
            <div class="absolute top-96 right-10 w-[450px] h-[280px] bg-secondary/10 rounded-full blur-[120px] pointer-events-none"></div>

            <div class="max-w-7xl mx-auto px-6 lg:px-12 relative z-10 space-y-12">
                
                <!-- Section Header & Category Filters -->
                <div class="flex flex-col md:flex-row md:items-end justify-between gap-6 pb-8 border-b border-border-subtle">
                    <div>
                        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-surface-container-high border border-border-subtle mb-3">
                            <span class="material-symbols-outlined text-primary text-[16px]">verified</span>
                            <span class="font-label-badge text-xs text-primary uppercase">Engineered Implementations</span>
                        </div>
                        <h1 class="font-headline-lg text-3xl sm:text-4xl text-text-primary font-bold tracking-tight">Featured Real-World Works</h1>
                        <p class="font-body-md text-sm sm:text-base text-text-secondary mt-2 max-w-2xl">
                            Verified client platforms, scalable web architectures, and production systems engineered for responsive reliability.
                        </p>
                    </div>

                    <!-- Category Filter Buttons (Dynamically updated from backend categories) -->
                    <div id="project-categories-filter" class="flex flex-wrap items-center gap-2">
                        <span class="font-code-sm text-xs text-text-muted mr-1">Filter:</span>
                        <button type="button" class="project-filter-btn px-3 py-1.5 rounded-lg bg-primary-container text-on-primary-container font-code-sm text-xs font-semibold transition-all" data-filter="all">All</button>
                    </div>
                </div>

                <!-- Projects Grid (Hydrated dynamically from backend API) -->
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8" id="projects-grid">
                    
                    <!-- Loading Skeleton Placeholder 1 -->
                    <div class="bg-surface-card rounded-2xl overflow-hidden backdrop-blur-xl border border-border-subtle shadow-xl flex flex-col animate-pulse">
                        <div class="h-64 bg-surface-container-high/60 flex items-center justify-center relative">
                            <span class="material-symbols-outlined text-text-muted/30 text-[48px]">layers</span>
                            <div class="absolute top-4 left-4 h-6 w-32 rounded-full bg-surface-container-lowest/80 border border-border-subtle"></div>
                            <div class="absolute top-4 right-4 h-6 w-24 rounded-full bg-surface-container-lowest/80 border border-border-subtle"></div>
                        </div>
                        <div class="p-7 flex flex-col flex-grow space-y-4">
                            <div class="h-7 bg-surface-container-high rounded-md w-3/4"></div>
                            <div class="space-y-2 pt-1">
                                <div class="h-4 bg-surface-container-high/60 rounded-md w-full"></div>
                                <div class="h-4 bg-surface-container-high/60 rounded-md w-5/6"></div>
                            </div>
                            <div class="flex flex-wrap gap-2 pt-2">
                                <div class="h-6 bg-surface-container-high/50 rounded-full w-20"></div>
                                <div class="h-6 bg-surface-container-high/50 rounded-full w-24"></div>
                                <div class="h-6 bg-surface-container-high/50 rounded-full w-16"></div>
                            </div>
                            <div class="mt-auto pt-4 flex items-center justify-between border-t border-border-subtle">
                                <div class="h-8 bg-surface-container-high rounded-lg w-28"></div>
                                <div class="h-8 bg-surface-container-high rounded-lg w-20"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Loading Skeleton Placeholder 2 -->
                    <div class="bg-surface-card rounded-2xl overflow-hidden backdrop-blur-xl border border-border-subtle shadow-xl flex flex-col animate-pulse">
                        <div class="h-64 bg-surface-container-high/60 flex items-center justify-center relative">
                            <span class="material-symbols-outlined text-text-muted/30 text-[48px]">layers</span>
                            <div class="absolute top-4 left-4 h-6 w-36 rounded-full bg-surface-container-lowest/80 border border-border-subtle"></div>
                            <div class="absolute top-4 right-4 h-6 w-20 rounded-full bg-surface-container-lowest/80 border border-border-subtle"></div>
                        </div>
                        <div class="p-7 flex flex-col flex-grow space-y-4">
                            <div class="h-7 bg-surface-container-high rounded-md w-2/3"></div>
                            <div class="space-y-2 pt-1">
                                <div class="h-4 bg-surface-container-high/60 rounded-md w-full"></div>
                                <div class="h-4 bg-surface-container-high/60 rounded-md w-4/5"></div>
                            </div>
                            <div class="flex flex-wrap gap-2 pt-2">
                                <div class="h-6 bg-surface-container-high/50 rounded-full w-24"></div>
                                <div class="h-6 bg-surface-container-high/50 rounded-full w-20"></div>
                                <div class="h-6 bg-surface-container-high/50 rounded-full w-28"></div>
                            </div>
                            <div class="mt-auto pt-4 flex items-center justify-between border-t border-border-subtle">
                                <div class="h-8 bg-surface-container-high rounded-lg w-28"></div>
                                <div class="h-8 bg-surface-container-high rounded-lg w-20"></div>
                            </div>
                        </div>
                    </div>

                </div>

            </div>

        </div>
    </main>

    <!-- Case Study Interactive Modal / Drawer -->
    <div id="case-study-modal" class="fixed inset-0 bg-surface-container-lowest/80 backdrop-blur-md z-50 opacity-0 pointer-events-none transition-opacity duration-300 flex items-center justify-center p-4 sm:p-6">
        <div class="bg-surface-card border border-border-accent rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto p-6 sm:p-8 relative shadow-2xl backdrop-blur-2xl">
            <button id="case-study-close" type="button" class="absolute top-5 right-5 w-8 h-8 rounded-lg bg-surface-container-high flex items-center justify-center text-text-muted hover:text-text-primary transition-colors border border-border-subtle" aria-label="Close Case Study">
                <span class="material-symbols-outlined text-[20px]">close</span>
            </button>
            <div id="case-study-content">
                <!-- Injected via portfolio-core.js -->
            </div>
        </div>
    </div>

    <!-- Centralized Persistent Footer -->
    <div id="site-footer"></div>

    <!-- Core Interactive Scripts -->
    <script src="assets/js/portfolio-api.js"></script>
    <script src="assets/js/components.js"></script>
    <script src="assets/js/portfolio-core.js"></script>
</body>
</html>
